<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03120d" />
      <stop offset="100%" stop-color="#0a1f18" />
    </linearGradient>
  </defs>

  <!-- Full bleed vibrant gradient background matching .brand-icon -->
  <rect width="512" height="512" fill="url(#brandGrad)" />
  
  <!-- Subtle specular gloss curve for depth -->
  <path d="M 0 0 L 512 0 L 512 200 C 350 240 160 220 0 200 Z" fill="url(#specular)" opacity="0.7" />

  <!-- Centered CalendarHeart Lucide Icon -->
  <g transform="translate(121, 121) scale(11.25)" 
     stroke="#04130e" 
     stroke-width="2.2" 
     stroke-linecap="round" 
     stroke-linejoin="round" 
     fill="none">
    <!-- Calendar Body Outline -->
    <path d="M12.127 21H5a2 2 0 01-2-2V5a2 2 0 012-2h14a2 2 0 012 2v5.125" />
    <!-- Heart Badge with subtle dark fill -->
    <path d="M14.62 17.8A2.25 2.25 0 0118 14.836a2.25 2.25 0 013.38 2.966l-2.626 2.856a.998.998 0 01-1.507 0z" fill="url(#heartGrad)" />
    <!-- Binder Rings -->
    <path d="M16 2v3" />
    <path d="M8 2v3" />
    <!-- Header Line -->
    <path d="M3 9h18" />
  </g>
</svg>
